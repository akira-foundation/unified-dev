<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signed in · Unified Dev</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(124, 58, 237, 0.35), transparent 60%),
        radial-gradient(900px 500px at 100% 100%, rgba(59, 130, 246, 0.18), transparent 60%),
        #09090b;
      color: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px 32px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 30px 60px -20px rgba(0, 0, 0, 0.6);
      text-align: center;
      animation: rise 480ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d8b4fe;
      margin-bottom: 28px;
    }
    .brand-mark {
      width: 22px; height: 22px;
      border-radius: 6px;
      background: #7c3aed;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.45);
    }
    .check {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 380ms 200ms backwards cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 8px;
    }
    p {
      margin: 0;
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.5;
    }
    .hint {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 12px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-mark">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: white;"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </span>
      Unified Dev
    </div>
    <div class="check">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Signed in</h1>
    <p>You can close this tab and return to Unified Dev.</p>
    <p class="hint">This window will close automatically.</p>
  </div>
  <script>
    setTimeout(function () {
      try { window.close(); } catch (e) {}
    }, 1500);
  </script>
</body>
</html>
