name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-aarch64:
    name: Build (aarch64)
    runs-on: macos-latest
    outputs:
      filename: ${{ steps.meta.outputs.filename }}
      sig: ${{ steps.meta.outputs.sig }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Create .env for build
        run: |
          echo "AKIRA_API_URL=${{ secrets.AKIRA_API_URL }}" >> .env
          echo "GITHUB_CLIENT_ID=${{ secrets.GH_OAUTH_CLIENT_ID }}" >> .env

      - name: Build application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run tauri build --target aarch64-apple-darwin

      - name: Collect artifact metadata
        id: meta
        shell: bash
        run: |
          echo "=== bundle/macos contents ==="
          find src-tauri/target/aarch64-apple-darwin/release/bundle -type f | sort
          TAR=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.app.tar.gz" | head -1)
          if [ -z "$TAR" ]; then
            echo "ERROR: no .app.tar.gz found"
            exit 1
          fi
          FILENAME=$(basename "$TAR")
          echo "TAR=${TAR}"
          echo "FILENAME=${FILENAME}"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "sig<<EOF_SIG" >> "$GITHUB_OUTPUT"
          cat "${TAR}.sig" >> "$GITHUB_OUTPUT"
          echo "EOF_SIG" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to Digital Ocean Spaces
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION=${GITHUB_SHA::7}
          fi
          for file in \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              aws s3 cp "$file" "s3://unified-dev/releases/v${VERSION}/${filename}" \
                --endpoint-url https://nyc3.digitaloceanspaces.com \
                --region us-east-1 \
                --acl public-read
            fi
          done

  build-x86_64:
    name: Build (x86_64)
    runs-on: macos-latest
    outputs:
      filename: ${{ steps.meta.outputs.filename }}
      sig: ${{ steps.meta.outputs.sig }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Create .env for build
        run: |
          echo "AKIRA_API_URL=${{ secrets.AKIRA_API_URL }}" >> .env
          echo "GITHUB_CLIENT_ID=${{ secrets.GH_OAUTH_CLIENT_ID }}" >> .env

      - name: Build application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run tauri build --target x86_64-apple-darwin

      - name: Collect artifact metadata
        id: meta
        shell: bash
        run: |
          echo "=== bundle/macos contents ==="
          find src-tauri/target/x86_64-apple-darwin/release/bundle -type f | sort
          TAR=$(find src-tauri/target/x86_64-apple-darwin/release/bundle -name "*.app.tar.gz" | head -1)
          if [ -z "$TAR" ]; then
            echo "ERROR: no .app.tar.gz found"
            exit 1
          fi
          FILENAME=$(basename "$TAR")
          echo "TAR=${TAR}"
          echo "FILENAME=${FILENAME}"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "sig<<EOF_SIG" >> "$GITHUB_OUTPUT"
          cat "${TAR}.sig" >> "$GITHUB_OUTPUT"
          echo "EOF_SIG" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to Digital Ocean Spaces
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION=${GITHUB_SHA::7}
          fi
          for file in \
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz \
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig \
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              aws s3 cp "$file" "s3://unified-dev/releases/v${VERSION}/${filename}" \
                --endpoint-url https://nyc3.digitaloceanspaces.com \
                --region us-east-1 \
                --acl public-read
            fi
          done

  publish:
    name: Publish latest.json
    needs: [build-aarch64, build-x86_64]
    runs-on: ubuntu-latest

    steps:
      - name: Generate and upload latest.json
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION=${GITHUB_SHA::7}
          fi
          RELEASE_URL="https://unified-dev.nyc3.cdn.digitaloceanspaces.com/releases/v${VERSION}"

          AARCH64_FILENAME="${{ needs.build-aarch64.outputs.filename }}"
          X86_FILENAME="${{ needs.build-x86_64.outputs.filename }}"
          AARCH64_SIG="${{ needs.build-aarch64.outputs.sig }}"
          X86_SIG="${{ needs.build-x86_64.outputs.sig }}"

          PUB_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          AARCH64_URL="${RELEASE_URL}/$(echo "${AARCH64_FILENAME}" | sed 's/ /%20/g')"
          X86_URL="${RELEASE_URL}/$(echo "${X86_FILENAME}" | sed 's/ /%20/g')"

          python3 -c "
import json, sys
data = {
  'version': sys.argv[1],
  'notes': 'Release ' + sys.argv[1],
  'pub_date': sys.argv[2],
  'platforms': {
    'darwin-aarch64': {'signature': sys.argv[3], 'url': sys.argv[4]},
    'darwin-x86_64':  {'signature': sys.argv[5], 'url': sys.argv[6]},
  }
}
print(json.dumps(data, indent=2))
" "$VERSION" "$PUB_DATE" "$AARCH64_SIG" "$AARCH64_URL" "$X86_SIG" "$X86_URL" > latest.json

          echo "Generated latest.json:"
          cat latest.json

          aws s3 cp latest.json "s3://unified-dev/releases/latest.json" \
            --endpoint-url https://nyc3.digitaloceanspaces.com \
            --region us-east-1 \
            --acl public-read \
            --content-type application/json

          echo "latest.json uploaded"

