name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          # - os: ubuntu-latest
          #   target: x86_64-unknown-linux-gnu
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},aarch64-apple-darwin

      # - name: Install dependencies (Linux)
      #   if: runner.os == 'Linux'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Create .env for build
        run: |
          echo "AKIRA_API_URL=${{ secrets.AKIRA_API_URL }}" >> .env
          echo "GITHUB_CLIENT_ID=${{ secrets.GH_OAUTH_CLIENT_ID }}" >> .env

      - name: Build application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run tauri build

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/dmg/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS to Digital Ocean Spaces
        if: runner.os == 'macOS'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          for file in src-tauri/target/release/bundle/dmg/*.dmg; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              aws s3 cp "$file" "s3://unified-dev/releases/v${VERSION}/${filename}" \
                --endpoint-url https://nyc3.digitaloceanspaces.com \
                --region us-east-1 \
                --acl public-read
            fi
          done

      # - name: Upload Linux artifacts
      #   if: runner.os == 'Linux'
      #   uses: softprops/action-gh-release@v1
      #   with:
      #     files: src-tauri/target/release/bundle/appimage/*
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Upload Linux to Digital Ocean Spaces
      #   if: runner.os == 'Linux'
      #   shell: bash
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
      #   run: |
      #     VERSION=${GITHUB_REF#refs/tags/v}
      #     for file in src-tauri/target/release/bundle/appimage/*.AppImage*; do
      #       if [ -f "$file" ]; then
      #         filename=$(basename "$file")
      #         aws s3 cp "$file" "s3://unified-dev/releases/v${VERSION}/${filename}" \
      #           --endpoint-url https://nyc3.digitaloceanspaces.com \
      #           --region us-east-1 \
      #           --acl public-read
      #       fi
      #     done

      # - name: Upload Windows artifacts
      #   if: runner.os == 'Windows'
      #   uses: softprops/action-gh-release@v1
      #   with:
      #     files: |
      #       src-tauri/target/release/bundle/msi/*
      #       src-tauri/target/release/bundle/nsis/*
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Upload Windows to Digital Ocean Spaces
      #   if: runner.os == 'Windows'
      #   shell: bash
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
      #   run: |
      #     VERSION=${GITHUB_REF#refs/tags/v}
      #     for file in src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe; do
      #       if [ -f "$file" ]; then
      #         filename=$(basename "$file")
      #         aws s3 cp "$file" "s3://unified-dev/releases/v${VERSION}/${filename}" \
      #           --endpoint-url https://nyc3.digitaloceanspaces.com \
      #           --region us-east-1 \
      #           --acl public-read
      #       fi
      #     done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: src-tauri/target/release/bundle/

  create-release:
    name: Create Release Manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Create latest.json for updater
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          RELEASE_URL="https://unified-dev.nyc3.cdn.digitaloceanspaces.com/releases/v${VERSION}"

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${VERSION}",
            "pub_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "${RELEASE_URL}/Unified%20Dev_${VERSION}_aarch64.dmg"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "${RELEASE_URL}/Unified%20Dev_${VERSION}_aarch64.dmg"
              }
            }
          }
          EOF
          cat latest.json

      - name: Upload latest.json to Digital Ocean Spaces
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          if [ -z "${{ env.VERSION }}" ]; then
            echo "ERROR: VERSION not set"
            exit 1
          fi

          echo "Uploading latest.json for version ${{ env.VERSION }}"
          aws s3 cp latest.json "s3://unified-dev/releases/latest.json" \
            --endpoint-url https://nyc3.digitaloceanspaces.com \
            --region us-east-1 \
            --acl public-read \
            --content-type application/json

          echo "Upload completed"
