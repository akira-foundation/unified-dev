            fi
          done

  publish:
    name: Publish latest.json
    needs: [build-aarch64, build-x86_64]
    runs-on: ubuntu-latest

    steps:
      - name: Generate and upload latest.json
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION=${GITHUB_SHA::7}
          fi
          RELEASE_URL="https://unified-dev.nyc3.cdn.digitaloceanspaces.com/releases/v${VERSION}"

          AARCH64_FILENAME="${{ needs.build-aarch64.outputs.filename }}"
          X86_FILENAME="${{ needs.build-x86_64.outputs.filename }}"
          AARCH64_SIG=$(echo "${{ needs.build-aarch64.outputs.sig }}" | base64 --decode)
          X86_SIG=$(echo "${{ needs.build-x86_64.outputs.sig }}" | base64 --decode)

          PUB_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          AARCH64_URL="${RELEASE_URL}/$(echo "${AARCH64_FILENAME}" | sed 's/ /%20/g')"
          X86_URL="${RELEASE_URL}/$(echo "${X86_FILENAME}" | sed 's/ /%20/g')"

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg aarch64_sig "$AARCH64_SIG" \
            --arg aarch64_url "$AARCH64_URL" \
            --arg x86_sig "$X86_SIG" \
            --arg x86_url "$X86_URL" \
            '{
              version: $version,
              notes: ("Release " + $version),
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {signature: $aarch64_sig, url: $aarch64_url},
                "darwin-x86_64":  {signature: $x86_sig,    url: $x86_url}
              }
            }' > latest.json

          echo "Generated latest.json:"
          cat latest.json

          aws s3 cp latest.json "s3://unified-dev/releases/latest.json" \
            --endpoint-url https://nyc3.digitaloceanspaces.com \
            --region us-east-1 \
            --acl public-read \
            --content-type application/json \
            --cache-control "no-cache"

          echo "latest.json uploaded"

  sync-main:
    name: Sync version and changelog to main
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='${VERSION}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node scripts/sync-version.js
          awk -v v="$VERSION" '/^name = "unified-dev"$/{print;getline;sub(/version = ".*"/,"version = \"" v "\"");print;next}1' src-tauri/Cargo.lock > Cargo.lock.tmp && mv Cargo.lock.tmp src-tauri/Cargo.lock

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate CHANGELOG
        run: git-cliff --config cliff.toml --tag "${{ github.ref_name }}" --output CHANGELOG.md

      - name: Commit version and changelog to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/Cargo.lock CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: release ${{ github.ref_name }}"
          git push origin HEAD:main

  publish-changelog:
    name: Publish changelog to landing page
    needs: [build-aarch64, build-x86_64, sync-main]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout landing page repo
        uses: actions/checkout@v4
        with:
          repository: kidiatoliny/unified-dev-landing-page
          token: ${{ secrets.LANDING_PAGE_TOKEN }}
          path: landing

      - name: Parse changelog and update landing page
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const version = process.env.RELEASE_TAG;
            const semver  = version.replace(/^v/, '');
            const dateStr = new Date().toLocaleDateString('en-US', {
              month: 'short', day: 'numeric', year: 'numeric'
            });

            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');

            const blockMatch = changelog.match(/^#+ \[[\d.]+\].*\n([\s\S]*?)(?=\n#+ \[|$(?![\s\S]))/m);
            if (!blockMatch) core.setFailed('Could not find release block in CHANGELOG.md');

            const block = blockMatch[1];

            function parseSection(sectionName) {
              const sectionMatch = block.match(
                new RegExp(`### ${sectionName}\\n([\\s\\S]*?)(?=\\n###|$)`)
              );
              if (!sectionMatch) return [];

              const entries = [];
              const re = /^- (?:\*\*([^*]+?):\*\* )?(.+?) \(\[?[a-f0-9]/gm;
              let m;
              while ((m = re.exec(sectionMatch[1])) !== null) {
                const scope = m[1] ?? 'general';
                const text  = m[2].charAt(0).toUpperCase() + m[2].slice(1);
                entries.push({ scope, text });
              }
              return entries;
            }

            const features = parseSection('Features');
            const fixes    = parseSection('Bug Fixes');

            console.log(`Parsed ${features.length} features, ${fixes.length} fixes for ${version}`);

            if (features.length === 0 && fixes.length === 0) {
              console.log('Nothing to publish — skipping.');
              return;
            }

            const ind = '    ';

            function itemsToJs(items) {
              if (items.length === 0) return '[]';
              const lines = items.map(({ scope, text }) =>
                `${ind}    { scope: '${scope}', text: '${text.replace(/'/g, "\\'")}' },`
              );
              return `[\n${lines.join('\n')}\n${ind}]`;
            }

            const newEntry = [
              `${ind}{`,
              `${ind}    version: '${version}',`,
              `${ind}    date: '${dateStr}',`,
              `${ind}    latest: true,`,
              `${ind}    features: ${itemsToJs(features)},`,
              `${ind}    fixes: ${itemsToJs(fixes)},`,
              `${ind}},`,
            ].join('\n');

            const astroPath = path.join('landing', 'src/pages/changelog.astro');
            let astro = fs.readFileSync(astroPath, 'utf8');

            if (astro.includes(`version: '${version}'`)) {
              console.log(`${version} already present in changelog.astro — skipping.`);
              return;
            }

            astro = astro.replace(/^(\s+latest: true,\n)/m, '\n');
            astro = astro.replace(/(const releases = \[\n)/, `$1${newEntry}\n`);
            astro = astro.replace(
              /const FALLBACK_VERSION = '[^']+';/,
              `const FALLBACK_VERSION = '${semver}';`
            );
            fs.writeFileSync(astroPath, astro, 'utf8');
            console.log('changelog.astro updated.');

            const indexPath = path.join('landing', 'src/pages/index.astro');
            let indexAstro = fs.readFileSync(indexPath, 'utf8');
            indexAstro = indexAstro.replace(
              /const FALLBACK_VERSION = '[^']+';/,
              `const FALLBACK_VERSION = '${semver}';`
            );
            fs.writeFileSync(indexPath, indexAstro, 'utf8');
            console.log('index.astro FALLBACK_VERSION updated to', semver);

      - name: Commit and push to landing page
        working-directory: landing
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add src/pages/changelog.astro src/pages/index.astro
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(changelog): add ${{ github.ref_name }}"
            git push
          fi

