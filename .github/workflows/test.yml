name: Test

# What a push has to survive, and what a tag has to survive before release.yml
# publishes it: release.yml calls this workflow on the tagged commit and builds
# nothing until all three jobs below have passed there.
#
# Three jobs. lint and build run side by side, because they fail for different
# reasons and one push should tell you as much as it can at once. test waits
# for lint, so a spelling mistake does not take a macOS runner.
#
#   lint     the workflows, the shell scripts, the house rules and SwiftLint,
#            all on Linux, because not one of them needs a Mac.
#   build    swift build, which compiles the app target, Sources/UnifiedDev included.
#            Tools/test-core.sh mirrors only Core into a throwaway package
#            with no app target, so a view that stops compiling leaves the whole
#            suite green. That has broken main four times in a single day: widen
#            an enum, leave a switch non-exhaustive, tests pass, app does not
#            build. This job is what catches it.
#   test     ./Tools/test-core.sh, the Core suite, over three thousand
#            tests in about half a minute, and then
#            ./Tools/test-browser-scripts.sh, which runs the browser scripts in an
#            offscreen WKWebView. That one needs a Mac for WebKit and shares this
#            runner rather than taking a third one.
#
# build and test were one job with one after the other in it, and were 187 and
# 204 seconds of a 404 second run. They share no output, so they now share no
# runner either.
#
# A bundle is only built when somebody asks for one by hand, from the Actions
# tab. It used to be built on every push, which proved the app can be assembled
# on a runner. That is proven, and release.yml is what builds the copies people
# actually install, so paying for a zip nobody downloads on every commit was
# space and macOS minutes spent on a question already answered.
#
# The runner image and the toolchain check are copied from release.yml on
# purpose. If the two ever disagree about which Xcode builds Unified Dev, the release
# is the one that finds out, and it finds out at the worst moment.

on:
  # Push on main and develop, pull request for everything else, plus the manual
  # run below. Running on both for every branch meant a branch with a pull
  # request open was built twice for one commit, and a macOS minute on a
  # private repository bills at ten times the rate of a Linux one.
  #
  # Naming develop costs part of that back, and the honest figure was measured
  # rather than assumed. A pull_request run checks out the merge ref: the ref:
  # on the checkout steps below is empty unless release.yml passed one, so the
  # tree built is the head already merged into its base, not the head. With
  # strict protection respected the head contains the base tip, so the merge that lands has the same tree the
  # pull request run had, and this event rebuilds it for nothing.
  #
  # What is paid for is the rest. enforce_admins is off on develop and no
  # review is required, so strict does not bind whoever merges, and 29 of the
  # 86 pull request merges on develop's first-parent chain over thirty days
  # landed with a head that did not contain the base tip. In that third the
  # tree that landed was built by nothing, which is where a widened enum
  # leaving a switch non-exhaustive gets in. main was on this list throughout,
  # so those merges were built; develop was not.
  #
  # Comparing shas to decide any of this gets it backwards, so do not. A merge
  # ref sha is never the sha of the merge that lands, so every push run looks
  # like a commit no pull request run had seen whether the tree was new or
  # not. The question is the tree.
  #
  # Three consequences to know about. A branch with no pull request open is
  # built only from the Actions tab. A merge that lands on a release/* or a
  # milestone/* branch is built as a pull request and never as a merge, since
  # neither is named here. And two merges landing minutes apart leave the
  # earlier one with no verdict at all rather than one, because the
  # concurrency rule below cancels its run; what survives covers both merges,
  # which is the state a release branch is cut from but says nothing about
  # which of the two broke it.
  push:
    branches: [main, develop]
  pull_request:
  # The manual build. Run this workflow from the Actions tab, on any branch, to
  # get a UnifiedDev.app out of it without cutting a release.
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out and test, as a full SHA
        required: true
        type: string

permissions:
  # Nothing is written. The artifact, on the runs that make one, goes through
  # the actions API rather than contents.
  contents: read

concurrency:
  # A second push to a branch makes the first one's answer stale, so the older
  # run is dropped rather than left to occupy a macOS runner. The event is part
  # of the group so that a push does not cancel a manual build of the same
  # branch: that run was asked for by a person who wants the zip at the end.
  # A call from release.yml is grouped by the commit it tests, so nothing else
  # can cancel the answer a release is waiting for.
  group: unifieddev-test-${{ inputs.ref && format('release-{0}', inputs.ref) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  # Everything that does not need a Mac, on a runner that bills at a tenth of
  # the rate of one. It runs beside the build rather than in front of it, so a
  # spelling mistake and a broken build are reported by the same run.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      # Workflow files are only ever executed by GitHub, so a mistake in one is
      # found by pushing it and waiting. actionlint reads them here instead: it
      # knows the schema, the expression syntax and which contexts exist in
      # which place. Pinned, because this is a binary from the internet.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSfL "$url/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar xz actionlint
          # SC2153 is ignored, and only SC2153. actionlint hands every `run:`
          # block to shellcheck, which cannot see the step's `env:` block, so
          # every value passed in the safe way, through the environment rather
          # than interpolated into the script, looks to it like a misspelling of
          # a nearby local variable. That is the house pattern in release.yml
          # and it is not going to change.
          ./actionlint -no-color -ignore 'SC2153' .github/workflows/*.yml

      # Every script in this repository is zsh, and shellcheck refuses zsh
      # outright: it parses sh, bash, dash and ksh and nothing else. Forcing it
      # to read them as bash was tried and is worse than nothing. It cannot
      # parse a glob qualifier, so `for art in Resources/*.pdf(N)` is four
      # errors, and it does not know that zsh never word splits an unquoted
      # parameter, so its advice on Tools/release/keychain.sh would break a
      # working script. What zsh itself can do is parse them, which catches the
      # unbalanced quote and the missing fi, and that is what runs here.
      - name: Check the shell scripts parse
        run: |
          set -euo pipefail
          command -v zsh >/dev/null || sudo apt-get install -y -qq zsh
          command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          # Any tracked script, so a new one is covered the day it is added.
          git ls-files '*.sh' | while read -r script; do
            case "$(head -1 "$script")" in
              *zsh*) zsh -n "$script" ;;
              *) shellcheck "$script" ;;
            esac
            echo "ok $script"
          done

      # The rules that are ours rather than the language's. See the script.
      - name: Check licence packaging
        run: zsh Tools/release/tests/licences.sh

      - name: Check a release is published after its files are attached
        run: zsh Tools/release/tests/publish-order.sh

      - name: Check only a version tag reaches the release build
        run: zsh Tools/release/tests/release-tag.sh

      - name: Check a release is announced by the run that publishes it, or its rerun
        run: zsh Tools/release/tests/announcement.sh

      - name: Check a release waits for the tests on its tagged commit
        run: zsh Tools/release/tests/test-gate.sh

      - name: Install git-cliff
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: git-cliff

      - name: Check a breaking commit bumps the major, and only the #434 exception does not
        run: zsh Tools/release/tests/breaking-bump.sh

      - name: Check the release check refuses a dropped or repeated changelog entry
        run: zsh Tools/release/tests/changelog-check.sh

      - name: Check the app mark is the one Tools/icon/layers.py writes
        run: python3 Tools/icon/layers.py --check

      # Beside the mark check rather than over in the build, because these read
      # two text files and need no Mac at all. In the build they sat behind the
      # compile and behind the disk image, so a recoloured icon or a moved tile
      # was masked by whichever of those went red first.
      - name: Check the disk image background follows the icon
        run: |
          set -euo pipefail
          command -v zsh >/dev/null || sudo apt-get install -y -qq zsh
          zsh Tools/dmg/tests/background-tones.sh
          zsh Tools/dmg/tests/background-geometry.sh

      - name: Check the house rules
        run: ./Tools/house-rules.sh

      # And the rules that are the language's rather than ours, which is the other half.
      # `.swiftlint.yml` is tuned rather than default: the head of that file has the counts every
      # disabled rule produced and why each one is off.
      #
      # On Linux, and that is the point of it being in this job. SwiftLint is SwiftSyntax rather
      # than SourceKit for every rule that does not need a compiler log, so it needs no Xcode and
      # no Mac, and it took 0.9 seconds over 920 files on the machine this was written on. Putting
      # it on the macOS build would have added it to a runner that bills at ten times the rate to
      # answer a question that does not need one.
      #
      # `swiftlint-static` rather than `swiftlint`: the same binary linked against nothing, so the
      # runner needs no Swift runtime installed to run it. Pinned, because this is a binary from
      # the internet, and renamed onto the PATH so that CI and a developer run the same script
      # rather than two commands that have to be kept in step by hand.
      - name: Lint the Swift
        env:
          SWIFTLINT_VERSION: 0.65.1
        run: |
          set -euo pipefail
          command -v zsh >/dev/null || sudo apt-get install -y -qq zsh
          url="https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}"
          curl -sSfL -o swiftlint.zip "$url/swiftlint_linux_amd64.zip"
          mkdir -p swiftlint-bin
          unzip -q -j swiftlint.zip swiftlint-static -d swiftlint-bin
          mv swiftlint-bin/swiftlint-static swiftlint-bin/swiftlint
          chmod +x swiftlint-bin/swiftlint
          PATH="$PWD/swiftlint-bin:$PATH" ./Tools/swiftlint.sh

  # Compiling Sources/UnifiedDev, which is the question "does the app still build".
  #
  # This was one macOS job with the tests after it, and the two steps were 187
  # and 204 seconds of a 404 second run. Neither needs anything the other
  # produces: the build reads Sources/UnifiedDev, and Tools/test-core.sh builds its
  # own mirror from Core alone. Run in series they added up, run beside
  # each other the run is as long as the longer of the two, with lint in front
  # of the tests. The bill barely
  # moves, because the work is split rather than repeated: the same minutes are
  # spent, on two runners instead of one, and only the few seconds of checkout
  # and toolchain check are paid twice.
  build:
    runs-on: macos-26
    # A cold run is about three and a half minutes. Anything past thirty is
    # hung, and a hung job that is left alone bills for the full six hour
    # default.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      # Verbatim from release.yml. Swift 6 language mode, actool for the
      # layered icon and the App Intents metadata processor all come from Xcode,
      # and an older one would produce an app that builds with pieces missing.
      # It costs a couple of seconds and turns "the image changed its default
      # Xcode" from a wall of unrelated compiler errors into one sentence.
      - name: Check the toolchain
        run: |
          set -euo pipefail
          swift --version

          # How many cores swift build is about to spread itself over. It sets
          # no --jobs, so this number is the parallelism, and it is the first
          # thing to look at when a build time moves for no reason anybody can
          # see in the diff. macos-26 answered 3 in August 2026, which is worth
          # knowing twice over: it is why compiling dominates this workflow, and
          # it is a second reason to run this job beside the tests rather than
          # before them, because two jobs is six cores and one job is three.
          echo "cores: $(sysctl -n hw.ncpu)"

          # `xcodebuild -version` writes two lines and is piped nowhere, deliberately.
          #
          # Run 32536983369 died here with `-[_NSStdIOFileHandle writeData:]: Broken pipe` and
          # exit 134. The line was `xcodebuild -version | head -1`: head reads what it wants and
          # exits, which closes the pipe under a program that is still writing its second line.
          # xcodebuild writes through a Foundation FileHandle, which raises on EPIPE rather than
          # taking the signal, so the process aborts. It is a race between head exiting and
          # xcodebuild finishing, which is why it looked intermittent and was not: every run was
          # rolling the same dice.
          #
          # So the whole output is taken into a variable and the first line is read from there.
          # Nothing is piped, nothing can close early, and there is nothing left to retry.
          version="$(xcodebuild -version)"
          echo "$version"

          major="$(printf '%s\n' "$version" | sed -n '1s/^Xcode \([0-9]*\).*/\1/p')"
          if [ -z "$major" ]; then
            echo "Could not read a major version out of: $version"
            exit 1
          fi
          if [ "$major" -lt 26 ]; then
            echo "Unified Dev needs Xcode 26 or newer, this runner has $major."
            exit 1
          fi

      # There is no cache step here, and that is a measured decision rather
      # than an omission.
      #
      # A cold `swift build` spends about forty three seconds before the
      # compiler starts: compiling the manifest, fetching SwiftTerm and
      # swift-argument-parser, working out which versions satisfy the ranges,
      # and checking out the working copies. All of it looks cacheable, and Package.resolved pins the
      # three so a key on that file would hit on every run.
      #
      # It was tried, on runs 32820412787 and 32820771440. Caching
      # .build/checkouts, .build/repositories, .build/artifacts and
      # ~/Library/Caches/org.swift.swiftpm took those forty three seconds to
      # thirty nine, on two runs whose compile phases came out within one per
      # cent of each other, so the comparison is clean. Four seconds, for a
      # hundred and fifty six megabyte cache entry moved twice a run. SwiftPM
      # still recomputes which versions satisfy the ranges with the
      # repositories already on disk.
      #
      # Nothing compiled is worth caching either, and for a different reason.
      # A build directory tarred and restored to the same path stays fully
      # incremental, so llbuild does not mind the inodes changing. But
      # actions/checkout stamps every source file with today's mtime, which it
      # does mind, so cached object files for our own code are rebuilt whatever
      # is on disk. Making that work needs mtimes that follow the commit history
      # rather than the checkout, which is a change with a failure mode worth
      # watching and does not belong hidden in a cache step.

      # Debug, because nothing downstream consumes these objects. The question
      # this step answers is "does Sources/UnifiedDev still compile", and a debug
      # build answers it faster. The manual build below makes its own release
      # build through Tools/build.sh.
      #
      # -warnings-as-errors lives here rather than in Package.swift so that a
      # local build stays tolerant while a run of this workflow does not. The
      # tree has been at zero warnings since a33e0c9 and this is what keeps it
      # there. The flag reaches the dependencies as well as our own targets, so
      # a warning in SwiftTerm would fail this build. That is acceptable
      # because Package.resolved is committed: the versions are pinned, nothing
      # moves on its own, and the only commit that can introduce a dependency
      # warning is a deliberate bump, whose author is right here to see it. If
      # that day comes and the warning is not ours to fix, move the flag into
      # Package.swift behind an environment variable so it applies to the
      # Unified Dev and Core targets only.
      - name: Build the app target
        run: swift build -Xswiftc -warnings-as-errors

      # From a stub bundle rather than a release build, so it costs seconds. The
      # release job is the only other thing that builds a disk image, and it runs
      # on a tag, which is the worst moment to find out.
      - name: Check the disk image builds
        run: zsh Tools/dmg/tests/disk-image.sh

      - name: Check a signing identity with an accent reaches codesign intact
        run: zsh Tools/release/tests/codesign-identity.sh

      - name: Check welcome navigation and window sizing
        run: ./Tools/welcome-layout-probe.sh

      - name: Check clicks on an answer's code blocks and the reply card
        run: ./Tools/transcript-click-probes.sh

      - name: Check diff scrolling and comment focus
        run: ./Tools/review-run-probe.sh

      - name: Check that a file marked as viewed folds
        run: ./Tools/review-run-probe.sh --review-fold-only

      - name: Preserve failed review probe evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-probe-evidence
          path: ${{ runner.temp }}/unifieddev-review-probe
          if-no-files-found: ignore
          retention-days: 3

      # Everything below only happens on a manual run.
      #
      # Assembles UnifiedDev.app: the icon, the App Intents metadata, and an
      # ad-hoc signature. No secrets are involved, and
      # none of the signing, notarisation or bucket steps in release.yml are
      # touched. The result is an app nobody has vouched for, which is the point
      # for now: it is here to be tried, not to be handed out.
      - name: Assemble the app bundle
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.ref }}
        run: ./Tools/build.sh -r

      - name: Zip the bundle
        id: zip
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.ref }}
        run: |
          set -euo pipefail
          app="$(swift build -c release --show-bin-path)/UnifiedDev.app"
          [ -d "$app" ] || { echo "No bundle at $app"; exit 1; }
          mkdir -p dist
          # ditto, never zip. The bundle carries extended attributes and a
          # signature, which zip drops.
          /usr/bin/ditto -c -k --keepParent "$app" "dist/Unified Dev.zip"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Zipped $(du -h "dist/Unified Dev.zip" | cut -f1)"

      # The zip is uploaded rather than the bundle, because this action zips
      # what it is given with a zipper of its own that does not keep symlinks.
      # A downloaded artifact is therefore a zip inside a zip, and the inner one
      # is the bundle ditto made.
      - name: Upload the app
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.ref }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Unified Dev-${{ steps.zip.outputs.sha }}
          path: dist/Unified Dev.zip
          retention-days: 14
          if-no-files-found: error

      - name: Say how to open it
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.ref }}
        run: |
          {
            echo "### Unified Dev ${{ steps.zip.outputs.sha }}"
            echo
            echo "The artifact is a zip holding \`Unified Dev.zip\`, which holds \`UnifiedDev.app\`."
            echo "It is ad-hoc signed and not notarised, so Gatekeeper quarantines it"
            echo "on download and refuses to open it. After unzipping both layers:"
            echo
            echo '```'
            echo "xattr -d -r com.apple.quarantine /path/to/UnifiedDev.app"
            echo "open /path/to/UnifiedDev.app"
            echo '```'
            echo
            echo "It keeps the real bundle id, so it uses the real database and the"
            echo "real preferences."
          } >> "$GITHUB_STEP_SUMMARY"

  # The two test suites, on their own runner beside the build, once lint has
  # passed.
  #
  # It caches nothing, and there is nothing here to cache. Both scripts write a
  # package with no dependencies at all, so there is no resolve to skip, and
  # the rest of the time goes on compiling Core and fifty one thousand lines of
  # test source, which a fresh checkout's mtimes force to be recompiled
  # whatever is on disk. Core is compiled twice, once per mirror, because the
  # two have separate scratch paths; that is the price of the browser target
  # being able to link WebKit while the core mirror holds the line that nothing
  # in the core may.
  test:
    needs: lint
    runs-on: macos-26
    # A cold run is about three and a half minutes for the core suite, and
    # about as long again for the browser one after it.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      # Around thirty tests make a real commit with this machine's git, and
      # RepositoryStarter refuses to commit without a name and an address. A
      # fresh runner has neither, so one of them fails outright and the rest
      # return early and assert nothing. This is what makes them run at all.
      #
      # Before the toolchain check, not after it. `RepositoryStarter` makes a first commit
      # and a commit needs an author, so this is a prerequisite of the tests rather than a
      # step that happens to come before them. Behind the version probe it was skipped when
      # that probe crashed, and the run reported a test failure for a missing git identity
      # caused by a SIGABRT in xcodebuild.
      - name: Give the runner a git identity
        run: |
          set -euo pipefail
          git config --global user.email "kidiatoliny@gmail.com"
          git config --global user.name "kid"

      # The same check the build job makes, and made here too rather than
      # depended on. Waiting for the build job to vouch for the toolchain would
      # put the two back in series, which is the thing this split exists to
      # undo, and an image that changed its Xcode should say so in one sentence
      # here as well as there.
      - name: Check the toolchain
        run: |
          set -euo pipefail
          swift --version
          echo "cores: $(sysctl -n hw.ncpu)"
          version="$(xcodebuild -version)"
          echo "$version"
          major="$(printf '%s\n' "$version" | sed -n '1s/^Xcode \([0-9]*\).*/\1/p')"
          if [ -z "$major" ]; then
            echo "Could not read a major version out of: $version"
            exit 1
          fi
          if [ "$major" -lt 26 ]; then
            echo "Unified Dev needs Xcode 26 or newer, this runner has $major."
            exit 1
          fi

      - name: Run the core tests
        run: ./Tools/test-core.sh

      # The browser scripts, in a real page. These are the JavaScript bodies in
      # `BrowserAgentScript` and `BrowserPageScript`, and nothing ran a character of them until
      # this step existed: the core suite depends on `Core` alone and has no WebKit. They are a
      # second test target rather than part of the suite above, because a target that links
      # WebKit cannot be in a package that holds the line about who imports a UI framework.
      #
      # A step on this runner rather than a fourth job beside it. A macOS minute on a private
      # repository bills at ten times a Linux one, and this asks the same question the step above
      # asks, unlike the build job, which asks a different one and is a job for that reason. The
      # cost is that the core suite's answer and this one arrive one after the other.
      - name: Run the browser scripts in a real page
        run: ./Tools/test-browser-scripts.sh
