name: Sync docs to landing page

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout unified-dev
        uses: actions/checkout@v4

      - name: Checkout unified-dev-landing-page
        uses: actions/checkout@v4
        with:
          repository: akira-foundation/unified-dev-landing-page
          token: ${{ secrets.DOCS_TOKEN }}
          path: landing-page

      - name: Mirror docs into src/content/docs
        run: rsync -a --delete docs/ landing-page/src/content/docs/

      - name: Commit and push
        working-directory: landing-page
        run: |
          git config user.name "akira-docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"
          git add src/content/docs
          if git diff --cached --quiet; then
            echo "no docs changes to publish"
            exit 0
          fi
          git commit -m "docs: sync from unified-dev ${GITHUB_SHA::7}"
          git push
